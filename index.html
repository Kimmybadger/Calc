  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0a0a;overscroll-behavior:none}
    .app{font-family:'DM Sans',sans-serif;background:radial-gradient(ellipse at 30% 20%,#1a1200 0%,#0a0a0a 60%);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:0}

    @media(min-width:520px){.app{align-items:center;padding:24px}.phone{min-height:unset;border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06)}}

    .tab-icon{font-size:14px;line-height:1;opacity:.8}.tab.on .tab-icon{opacity:1}
    .display{padding:2px 22px 6px;min-height:100px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:1px}
    .disp-prev{font-family:'DM Mono',monospace;font-size:12px;color:rgba(255,255,255,.25);min-height:16px;letter-spacing:-.2px;transition:all .15s}
    .disp-expr{font-family:'DM Mono',monospace;font-size:15px;color:rgba(255,255,255,.45);min-height:20px;letter-spacing:-.4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .15s}
    .disp-main{font-family:'DM Mono',monospace;font-weight:300;color:#fff;letter-spacing:-3.5px;line-height:1;transition:font-size .1s ease;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .hist-trigger-row{display:flex;justify-content:space-between;align-items:center;padding:0 14px 4px;position:relative}
    .hist-left{display:flex;align-items:center;gap:6px}
    .bs-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:20px;color:#FF9500;font-size:16px;width:34px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0}

    .hist-trigger{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:20px;color:rgba(255,255,255,.5);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;padding:5px 12px 5px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s;letter-spacing:.2px}

    .hist-dropdown{position:absolute;top:calc(100% + 4px);left:0;width:100%;background:#1a1a1c;border:1px solid rgba(255,255,255,.1);border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.7);z-index:100;animation:dropIn .18s cubic-bezier(.34,1.56,.64,1)}
    @keyframes dropIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    .hist-dd-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 7px;border-bottom:1px solid rgba(255,255,255,.06)}

    .eng-mode-row{display:flex;gap:6px;padding:4px 14px}

    .eng-grid{padding:4px 12px 20px;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
    .ebtn{border:none;cursor:pointer;border-radius:14px;aspect-ratio:1;font-family:'DM Mono',monospace;font-size:13px;font-weight:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:filter .07s,transform .07s;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden;line-height:1.1}
    .ebtn:active{transform:scale(.91);filter:brightness(1.4)}
    .ebtn-sub{font-size:8px;color:#FF9500;font-family:'DM Sans',sans-serif;font-weight:600;opacity:.85}
    .ebtn-num{background:#1c1c1e;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
    .ebtn-fn{background:#2a2a2c;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
    .ebtn-trig{background:#1c1f2e;color:#a8b8ff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
    .ebtn-spec{background:#1f1800;color:#FF9500;box-shadow:0 2px 6px rgba(0,0,0,.4)}
    .ebtn-op{background:#FF9500;color:#fff;font-size:20px;box-shadow:0 3px 12px rgba(255,149,0,.35)}
    .ebtn-op.lit{background:#fff;color:#FF9500}
    .ebtn-eq{background:#FF9500;color:#fff;font-size:20px;box-shadow:0 3px 12px rgba(255,149,0,.4)}
    .ebtn-zero{border-radius:14px;aspect-ratio:unset;grid-column:span 2}
    .fx-wrap{flex:1;display:flex;flex-direction:column;padding:10px 14px 20px;gap:10px;overflow-y:auto}

    .fx-refresh{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:20px;color:rgba(255,255,255,.4);font-size:10px;font-family:'DM Sans',sans-serif;font-weight:500;padding:3px 10px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px}
    .fx-refresh:hover{color:#FF9500;border-color:rgba(255,149,0,.3);background:rgba(255,149,0,.08)}
    .fx-refresh.spinning{animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .fx-base{background:rgba(255,149,0,.08);border:1px solid rgba(255,149,0,.2);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .fx-base-left{display:flex;align-items:center;gap:10px;flex:1}
    .fx-flag{font-size:24px;line-height:1;flex-shrink:0}
    .fx-code{font-size:15px;font-weight:600;color:#fff;font-family:'DM Sans',sans-serif}

    .fx-input{background:transparent;border:none;outline:none;font-family:'DM Mono',monospace;font-size:26px;font-weight:300;color:#FF9500;text-align:right;width:130px;letter-spacing:-1px}

    .fx-row:hover{background:rgba(255,255,255,.06)}

    .fx-row-val{font-family:'DM Mono',monospace;font-size:17px;color:#fff;font-weight:300;letter-spacing:-.5px}
    .fx-row-rate{font-size:9px;color:rgba(255,255,255,.2);font-family:'DM Mono',monospace;text-align:right;margin-top:2px}
    .fx-loading{text-align:center;padding:30px;color:rgba(255,255,255,.2);font-size:12px}
    .unit-wrap{flex:1;display:flex;flex-direction:column;padding:10px 14px 20px;gap:10px;overflow-y:auto}
    .unit-cats{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:2px}
    .unit-cat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.45);font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;padding:5px 13px;border-radius:20px;cursor:pointer;transition:all .15s;white-space:nowrap}
    .unit-cat.on{background:rgba(255,149,0,.15);border-color:rgba(255,149,0,.4);color:#FF9500}
    .unit-input-box{background:rgba(255,149,0,.07);border:1px solid rgba(255,149,0,.2);border-radius:16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .unit-input-label{font-size:13px;font-weight:600;color:rgba(255,255,255,.7);font-family:'DM Sans',sans-serif;white-space:nowrap}
    .unit-input-sub{font-size:10px;color:rgba(255,149,0,.6);margin-top:2px}
    .unit-inp{background:transparent;border:none;outline:none;font-family:'DM Mono',monospace;font-size:24px;font-weight:300;color:#FF9500;text-align:right;width:140px;letter-spacing:-1px}
    .unit-list{display:flex;flex-direction:column;gap:6px}
    .unit-row{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:13px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background .12s}
    .unit-row:hover{background:rgba(255,255,255,.06)}
    .unit-row-name{font-size:12px;font-weight:600;color:rgba(255,255,255,.6);font-family:'DM Sans',sans-serif}
    .unit-row-sym{font-size:10px;color:rgba(255,149,0,.6);margin-top:1px;font-family:'DM Mono',monospace}
    .unit-row-val{font-family:'DM Mono',monospace;font-size:16px;color:#fff;font-weight:300;letter-spacing:-.5px;text-align:right}
    @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
    .pop{animation:pop .12s ease}
    @keyframes ripple{from{transform:scale(0);opacity:.4}to{transform:scale(2.5);opacity:0}}
    .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.25);width:60px;height:60px;margin-left:-30px;margin-top:-30px;animation:ripple .4s ease-out forwards;pointer-events:none}
  </style>

<body>
<div class="app"><div class="phone" id="app"></div></div>

<script>
// ── Helpers ──────────────────────────────────────────────────────────────────
const MAX_HIST = 10;
const $ = id => document.getElementById(id);

function fmt(n) {
  if (n === null || n === undefined || n === '') return '0';
  const s = String(n);
  if (s === 'Error' || s === 'Infinity' || s === '-Infinity') return s;
  const parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.join('.');
}
function numStr(n) {
  if (typeof n === 'number') return String(parseFloat(n.toPrecision(12)));
  return String(n);
}
function calcFontSize(val) {
  const len = String(val).replace(/[,.\-]/g,'').length;
  if (len <= 6) return '58px';
  if (len <= 9) return '46px';
  if (len <= 12) return '34px';
  return '26px';
}
function evaluate(a, op, b) {
  const fa = parseFloat(String(a).replace(/,/g,''));
  const fb = parseFloat(String(b).replace(/,/g,''));
  if (isNaN(fa)||isNaN(fb)) return 'Error';
  switch(op) {
    case '+': return fa+fb;
    case '−': return fa-fb;
    case '×': return fa*fb;
    case '÷': return fb===0?'Error':fa/fb;
    case '^': return Math.pow(fa,fb);
    default: return fb;
  }
}

// ── State ────────────────────────────────────────────────────────────────────
let state = {
  tab: 'standard',
  // standard
  display:'0', prevVal:null, op:null, waitNext:false, expr:'', prevExpr:'',
  history: JSON.parse(localStorage.getItem('calc_hist')||'[]'),
  histOpen: false,
  // engineering
  engDisplay:'0', engPrevVal:null, engOp:null, engWait:false,
  engExpr:'', engPrevExpr:'', engMode:'DEG', engSecond:false,
  // currency
  fxRates:{}, fxBase:'KRW', fxAmount:'1000000', fxLoading:false, fxUpdated:null,
  // units
  unitCat:'길이', unitFrom:0, unitAmount:'1',
};

function setState(patch) {
  Object.assign(state, typeof patch === 'function' ? patch(state) : patch);
  render();
}

// ── Calculator logic ──────────────────────────────────────────────────────────
function addHistory(expr, result) {
  state.history = [{expr, result}, ...state.history].slice(0, MAX_HIST);
  localStorage.setItem('calc_hist', JSON.stringify(state.history));
}

// Standard
function handleNum(d) {
  if (state.waitNext) { setState({display: d === '.' ? '0.' : d, waitNext: false}); return; }
  if (state.display === '0' && d !== '.') { setState({display: d}); return; }
  if (d === '.' && state.display.includes('.')) return;
  if (state.display.replace(/[,.\-]/g,'').length >= 12) return;
  setState({display: state.display + d});
}
function handleOp(newOp) {
  if (state.op && !state.waitNext) {
    const result = evaluate(state.prevVal, state.op, state.display);
    const raw = numStr(result);
    setState({display:raw, prevVal:raw, op:newOp, waitNext:true, expr:`${fmt(raw)} ${newOp}`});
  } else {
    setState({prevVal:state.display, op:newOp, waitNext:true, expr:`${fmt(state.display)} ${newOp}`});
  }
}
function handleEqual() {
  if (!state.op||!state.prevVal) return;
  const expression = `${fmt(state.prevVal)} ${state.op} ${fmt(state.display)}`;
  const result = evaluate(state.prevVal, state.op, state.display);
  const raw = numStr(result);
  addHistory(expression, fmt(raw));
  setState({prevExpr: expression+' =', expr:'', display:raw, prevVal:null, op:null, waitNext:true});
}
function handleAC() { setState({display:'0',prevVal:null,op:null,waitNext:false,expr:'',prevExpr:''}); }
function handlePlusMinus() {
  setState({display: state.display.startsWith('-') ? state.display.slice(1) : state.display==='0'?'0':'-'+state.display});
}
function handlePercent() {
  const v = parseFloat(state.display.replace(/,/g,''));
  if (!isNaN(v)) setState({display: numStr(v/100)});
}
function handleBS() {
  setState({display: state.display==='Error'||state.display.length<=1 ? '0' : state.display.slice(0,-1)||'0'});
}

// Engineering
function toRad(x) { return state.engMode==='DEG' ? x*Math.PI/180 : x; }
function fromRad(x) { return state.engMode==='DEG' ? x*180/Math.PI : x; }
function engNum(d) {
  if (state.engWait) { setState({engDisplay: d==='.'?'0.':d, engWait:false}); return; }
  if (state.engDisplay==='0'&&d!=='.') { setState({engDisplay:d}); return; }
  if (d==='.'&&state.engDisplay.includes('.')) return;
  if (state.engDisplay.replace(/[,.\-]/g,'').length>=12) return;
  setState({engDisplay: state.engDisplay+d});
}
function engUnary(label) {
  const v = parseFloat(state.engDisplay.replace(/,/g,''));
  const isSecond = state.engSecond;
  let result;
  switch(label) {
    case 'sin': result=isSecond?fromRad(Math.asin(v)):Math.sin(toRad(v)); break;
    case 'cos': result=isSecond?fromRad(Math.acos(v)):Math.cos(toRad(v)); break;
    case 'tan': result=isSecond?fromRad(Math.atan(v)):Math.tan(toRad(v)); break;
    case 'ln':  result=isSecond?Math.exp(v):Math.log(v); break;
    case 'log': result=isSecond?Math.pow(10,v):Math.log10(v); break;
    case '√':   result=isSecond?v*v:Math.sqrt(v); break;
    case 'n!': { const n=Math.round(v); result=n<0?NaN:n===0?1:Array.from({length:n},(_,i)=>i+1).reduce((a,b)=>a*b,1); break; }
    case '1/x': result=1/v; break;
    case '|x|': result=Math.abs(v); break;
    default: result=v;
  }
  if (!isFinite(result)||isNaN(result)) {
    setState({engDisplay:'Error',engPrevExpr:`${label}(${fmt(state.engDisplay)}) =`,engExpr:'',engWait:true,engSecond:false});
    return;
  }
  const raw = numStr(result);
  addHistory(`${label}(${fmt(state.engDisplay)})`, fmt(raw));
  setState({engDisplay:raw, engPrevExpr:`${label}(${fmt(state.engDisplay)}) =`, engExpr:'', engWait:true, engSecond:false});
}
function engBinary(newOp) {
  if (state.engOp&&!state.engWait) {
    const result = evaluate(state.engPrevVal, state.engOp, state.engDisplay);
    const raw = numStr(result);
    setState({engDisplay:raw, engPrevVal:raw, engOp:newOp, engWait:true, engExpr:`${fmt(raw)} ${newOp}`});
  } else {
    setState({engPrevVal:state.engDisplay, engOp:newOp, engWait:true, engExpr:`${fmt(state.engDisplay)} ${newOp}`});
  }
}
function engEqualFull() {
  if (!state.engOp||!state.engPrevVal) return;
  const expression = `${fmt(state.engPrevVal)} ${state.engOp} ${fmt(state.engDisplay)}`;
  const result = evaluate(state.engPrevVal, state.engOp, state.engDisplay);
  const raw = numStr(result);
  addHistory(expression, fmt(raw));
  setState({engPrevExpr:expression+' =', engExpr:'', engDisplay:raw, engPrevVal:null, engOp:null, engWait:true});
}
function engAC() { setState({engDisplay:'0',engPrevVal:null,engOp:null,engWait:false,engExpr:'',engPrevExpr:'',engSecond:false}); }
function engBS() { setState({engDisplay: state.engDisplay==='Error'||state.engDisplay.length<=1?'0':state.engDisplay.slice(0,-1)||'0'}); }

// Currency
const CURRENCIES = [
  {code:'KRW',flag:'🇰🇷',name:'한국 원'},
  {code:'USD',flag:'🇺🇸',name:'미국 달러'},
  {code:'JPY',flag:'🇯🇵',name:'일본 엔'},
  {code:'EUR',flag:'🇪🇺',name:'유로'},
  {code:'GBP',flag:'🇬🇧',name:'영국 파운드'},
  {code:'CNY',flag:'🇨🇳',name:'중국 위안'},
  {code:'HKD',flag:'🇭🇰',name:'홍콩 달러'},
  {code:'SGD',flag:'🇸🇬',name:'싱가포르 달러'},
  {code:'AUD',flag:'🇦🇺',name:'호주 달러'},

const MOCK_RATES = {KRW:1,USD:0.000735,JPY:0.1098,EUR:0.000678,GBP:0.000580,CNY:0.005321,HKD:0.005736,SGD:0.000992,AUD:0.001138,CAD:0.001018};

async function fetchRates() {
  setState({fxLoading:true});
  try {
    const res = await fetch('https://api.frankfurter.app/latest?from=KRW&to=USD,JPY,EUR,GBP,CNY,HKD,SGD,AUD,CAD');
    if (!res.ok) throw new Error();
    const data = await res.json();
    const rates = {KRW:1, ...data.rates};
    // cache for offline
    localStorage.setItem('fx_rates', JSON.stringify(rates));
    localStorage.setItem('fx_updated', new Date().toISOString());
    setState({fxRates:rates, fxUpdated:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}), fxLoading:false});
  } catch {
    // try cached
    const cached = localStorage.getItem('fx_rates');
    const cachedTime = localStorage.getItem('fx_updated');
    if (cached) {
      const t = cachedTime ? new Date(cachedTime).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
      setState({fxRates:JSON.parse(cached), fxUpdated:`캐시 데이터 ${t}`, fxLoading:false});
    } else {
      setState({fxRates:MOCK_RATES, fxUpdated:'샘플 데이터 (배포 후 실시간 연동)', fxLoading:false});
    }
  }
}
function convertFx(amount, from, to) {
  if (!state.fxRates[from]||!state.fxRates[to]) return null;
  const inKRW = parseFloat(amount)/state.fxRates[from];
  const result = inKRW*state.fxRates[to];
  if (!isFinite(result)) return null;
  if (to==='KRW'||to==='JPY') return result.toLocaleString('ko-KR',{maximumFractionDigits:0});
  return result.toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:4});
}

  ],
};
function convertUnit(val, fromIdx, toIdx, cat) {
  const units = UNIT_DATA[cat];
  const v = parseFloat(val);
  if (isNaN(v)||!units) return '—';
  if (fromIdx===toIdx) return v.toLocaleString('ko-KR',{maximumFractionDigits:8});
  const base = units[fromIdx].to(v);
  const result = units[toIdx].from(base);
  if (!isFinite(result)) return '—';
  if (Math.abs(result)>=1e10||(Math.abs(result)<0.000001&&result!==0)) return result.toExponential(4);
  return result.toLocaleString('ko-KR',{maximumFractionDigits:6});
}

// ── Ripple ───────────────────────────────────────────────────────────────────
function addRipple(e) {
  const btn = e.currentTarget;
  const r = document.createElement('span');
  r.className = 'ripple';
  const rect = btn.getBoundingClientRect();
  const x = (e.touches?e.touches[0].clientX:e.clientX) - rect.left;
  const y = (e.touches?e.touches[0].clientY:e.clientY) - rect.top;
  r.style.left = x+'px'; r.style.top = y+'px';
  btn.appendChild(r);
  setTimeout(()=>r.remove(), 400);
}

    });
  }

  const fxInp = document.getElementById('fx-amount-input');
  if (fxInp) {
    fxInp.addEventListener('input', ()=>{
      state.fxAmount = fxInp.value;
      const list = document.querySelector('.fx-list');
      if (list) {
        list.innerHTML = CURRENCIES.filter(c=>c.code!==state.fxBase).map(c=>{
          const val=convertFx(state.fxAmount||'0',state.fxBase,c.code);
          const rate=convertFx('1',state.fxBase,c.code);
          const rowIdx = reg(()=>fxSetBase(c.code, val?.replace(/,/g,'')||'0'));
          return `<div class="fx-row" data-idx="${rowIdx}">
            <div class="fx-row-left"><span class="fx-row-flag">${c.flag}</span>
              <div><div class="fx-row-code">${c.code}</div><div class="fx-row-name">${c.name}</div></div>
            </div>
            <div style="text-align:right">
              <div class="fx-row-val">${val??'—'}</div>
              <div class="fx-row-rate">1 ${state.fxBase} = ${rate} ${c.code}</div>
            </div></div>`;
        }).join('');
        attachEvents();
      }
    });
  }

  attachEvents();
}

function attachEvents() {
  document.querySelectorAll('[data-idx]').forEach(el=>{
    // 클론으로 교체해서 이전 이벤트 완전 제거
    const clone = el.cloneNode(true);
    el.parentNode.replaceChild(clone, el);
    clone.addEventListener('touchend', e=>{
      e.preventDefault();
      if (clone.tagName==='BUTTON') addRipple(e);
      runAction(+clone.dataset.idx);
    });
    clone.addEventListener('click', e=>{
      if (e.pointerType==='touch') return;
      if (clone.tagName==='BUTTON') addRipple(e);
      runAction(+clone.dataset.idx);
    });
  });
}

function setTab(t) {
  setState({tab:t, histOpen:false});
  if (t==='currency'&&Object.keys(state.fxRates).length===0) fetchRates();
}

// Keyboard support
document.addEventListener('keydown', e=>{
  if (state.tab!=='standard') return;
  if (document.activeElement?.tagName==='INPUT') return;
  if (e.key>='0'&&e.key<='9') handleNum(e.key);
  else if (e.key==='.') handleNum('.');
  else if (e.key==='+') handleOp('+');
  else if (e.key==='-') handleOp('−');
  else if (e.key==='*') handleOp('×');
  else if (e.key==='/') { e.preventDefault(); handleOp('÷'); }
  else if (e.key==='Enter'||e.key==='=') handleEqual();
  else if (e.key==='Backspace') handleBS();
  else if (e.key==='Escape') handleAC();
  else if (e.key==='%') handlePercent();
});

// Init
render();

// Service Worker 등록
if ('serviceWorker' in navigator) {
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js')
      .then(()=>console.log('SW registered'))
      .catch(e=>console.log('SW failed', e));
  });
}
</script>
</body>
</html>
