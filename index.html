    .fx-loading{text-align:center;padding:30px;color:rgba(255,255,255,.2);font-size:12px}
    .unit-wrap{flex:1;display:flex;flex-direction:column;padding:10px 14px 20px;gap:10px;overflow-y:auto}
    .unit-cats{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:2px}
    .unit-cat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.45);font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;padding:5px 13px;border-radius:20px;cursor:pointer;transition:all .15s;white-space:nowrap}

    .unit-input-box{background:rgba(255,149,0,.07);border:1px solid rgba(255,149,0,.2);border-radius:16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .unit-input-label{font-size:13px;font-weight:600;color:rgba(255,255,255,.7);font-family:'DM Sans',sans-serif;white-space:nowrap}
    .unit-input-sub{font-size:10px;color:rgba(255,149,0,.6);margin-top:2px}

    .unit-list{display:flex;flex-direction:column;gap:6px}
    .unit-row{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:13px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
    .unit-row:active{background:rgba(255,255,255,.06)}
    .unit-row-name{font-size:12px;font-weight:600;color:rgba(255,255,255,.6);font-family:'DM Sans',sans-serif}

<body>
<div class="app"><div class="phone" id="app"></div></div>
<script>
'use strict';

// ── 유틸 ─────────────────────────────────────────────────────────────────────
function fmt(n) {
  if (n === null || n === undefined || n === '') return '0';
  const s = String(n);
  if (s === 'Error') return s;
  const parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.join('.');
}
function numStr(n) {
  if (typeof n === 'number') return String(parseFloat(n.toPrecision(12)));
  return String(n);
}
function fontSize(val) {
  const len = String(val).replace(/[,.\-]/g,'').length;
  if (len <= 6) return '58px';
  if (len <= 9) return '46px';
  if (len <= 12) return '34px';
  return '26px';
}
function calcOp(a, op, b) {
  const fa = parseFloat(String(a).replace(/,/g,''));
  const fb = parseFloat(String(b).replace(/,/g,''));
  if (isNaN(fa)||isNaN(fb)) return 'Error';
  if (op==='+') return fa+fb;
  if (op==='−') return fa-fb;
  if (op==='×') return fa*fb;
  if (op==='÷') return fb===0?'Error':fa/fb;
  if (op==='^') return Math.pow(fa,fb);
  return fb;
}

// ── 이벤트 헬퍼 ───────────────────────────────────────────────────────────────
// touchstart로 즉시 반응, 이후 오는 click 이벤트는 무시
function on(el, fn) {
  if (!el) return;
  let didTouch = false;
  el.addEventListener('touchstart', e => {
    didTouch = true;
    e.preventDefault();
    fn();
  }, { passive: false });
  el.addEventListener('click', () => {
    if (didTouch) { didTouch = false; return; }
    fn();
  });
}

// ── 상태 ─────────────────────────────────────────────────────────────────────
const S = {
  tab: 'standard',
  display: '0', prevVal: null, op: null, waitNext: false, expr: '', prevExpr: '',
  history: (() => { try { return JSON.parse(localStorage.getItem('calc_hist')||'[]'); } catch{ return []; } })(),
  histOpen: false,
  eDisplay: '0', ePrevVal: null, eOp: null, eWait: false,
  eExpr: '', ePrevExpr: '', eMode: 'DEG', eSecond: false,
  fxRates: {}, fxBase: 'KRW', fxAmount: '1000000', fxLoading: false, fxUpdated: null,
  uCat: '길이', uFrom: 0, uAmount: '1',
};

function set(patch) { Object.assign(S, patch); render(); }
function saveHist() { localStorage.setItem('calc_hist', JSON.stringify(S.history)); }
function addHist(expr, result) { S.history = [{expr,result},...S.history].slice(0,10); saveHist(); }

// ── 일반 계산기 ───────────────────────────────────────────────────────────────
function stdNum(d) {
  if (S.waitNext) { set({display:d==='.'?'0.':d, waitNext:false}); return; }
  if (S.display==='0'&&d!=='.') { set({display:d}); return; }
  if (d==='.'&&S.display.includes('.')) return;
  if (S.display.replace(/[,.\-]/g,'').length>=12) return;
  set({display:S.display+d});
}
function stdOp(op) {
  if (S.op&&!S.waitNext) {
    const r=numStr(calcOp(S.prevVal,S.op,S.display));
    set({display:r,prevVal:r,op,waitNext:true,expr:`${fmt(r)} ${op}`});
  } else {
    set({prevVal:S.display,op,waitNext:true,expr:`${fmt(S.display)} ${op}`});
  }
}
function stdEq() {
  if (!S.op||!S.prevVal) return;
  const expr=`${fmt(S.prevVal)} ${S.op} ${fmt(S.display)}`;
  const r=numStr(calcOp(S.prevVal,S.op,S.display));
  addHist(expr,fmt(r));
  set({prevExpr:expr+' =',expr:'',display:r,prevVal:null,op:null,waitNext:true});
}
function stdAC() { set({display:'0',prevVal:null,op:null,waitNext:false,expr:'',prevExpr:''}); }
function stdBS() { set({display:S.display==='Error'||S.display.length<=1?'0':S.display.slice(0,-1)||'0'}); }
function stdPM() { set({display:S.display.startsWith('-')?S.display.slice(1):S.display==='0'?'0':'-'+S.display}); }
function stdPct() { const v=parseFloat(S.display.replace(/,/g,'')); if(!isNaN(v)) set({display:numStr(v/100)}); }

// ── 공학 계산기 ───────────────────────────────────────────────────────────────
function toRad(x) { return S.eMode==='DEG'?x*Math.PI/180:x; }
function fromRad(x) { return S.eMode==='DEG'?x*180/Math.PI:x; }
function engNum(d) {
  if (S.eWait) { set({eDisplay:d==='.'?'0.':d,eWait:false}); return; }
  if (S.eDisplay==='0'&&d!=='.') { set({eDisplay:d}); return; }
  if (d==='.'&&S.eDisplay.includes('.')) return;
  if (S.eDisplay.replace(/[,.\-]/g,'').length>=12) return;
  set({eDisplay:S.eDisplay+d});
}
function engUnary(label) {
  const v=parseFloat(S.eDisplay.replace(/,/g,'')), sec=S.eSecond;
  let r;
  switch(label) {
    case 'sin': r=sec?fromRad(Math.asin(v)):Math.sin(toRad(v)); break;
    case 'cos': r=sec?fromRad(Math.acos(v)):Math.cos(toRad(v)); break;
    case 'tan': r=sec?fromRad(Math.atan(v)):Math.tan(toRad(v)); break;
    case 'ln':  r=sec?Math.exp(v):Math.log(v); break;
    case 'log': r=sec?Math.pow(10,v):Math.log10(v); break;
    case '√':   r=sec?v*v:Math.sqrt(v); break;
    case 'n!': { const n=Math.round(v); r=n<0?NaN:n===0?1:Array.from({length:n},(_,i)=>i+1).reduce((a,b)=>a*b,1); break; }
    case '1/x': r=1/v; break;
    case '|x|': r=Math.abs(v); break;
    default: r=v;
  }
  if (!isFinite(r)||isNaN(r)) { set({eDisplay:'Error',ePrevExpr:`${label}(${S.eDisplay}) =`,eExpr:'',eWait:true,eSecond:false}); return; }
  const raw=numStr(r);
  addHist(`${label}(${fmt(S.eDisplay)})`,fmt(raw));
  set({eDisplay:raw,ePrevExpr:`${label}(${fmt(S.eDisplay)}) =`,eExpr:'',eWait:true,eSecond:false});
}
function engBinOp(op) {
  if (S.eOp&&!S.eWait) {
    const r=numStr(calcOp(S.ePrevVal,S.eOp,S.eDisplay));
    set({eDisplay:r,ePrevVal:r,eOp:op,eWait:true,eExpr:`${fmt(r)} ${op}`});
  } else {
    set({ePrevVal:S.eDisplay,eOp:op,eWait:true,eExpr:`${fmt(S.eDisplay)} ${op}`});
  }
}
function engEq() {
  if (!S.eOp||!S.ePrevVal) return;
  const expr=`${fmt(S.ePrevVal)} ${S.eOp} ${fmt(S.eDisplay)}`;
  const r=numStr(calcOp(S.ePrevVal,S.eOp,S.eDisplay));
  addHist(expr,fmt(r));
  set({ePrevExpr:expr+' =',eExpr:'',eDisplay:r,ePrevVal:null,eOp:null,eWait:true});
}
function engAC() { set({eDisplay:'0',ePrevVal:null,eOp:null,eWait:false,eExpr:'',ePrevExpr:'',eSecond:false}); }
function engBS() { set({eDisplay:S.eDisplay==='Error'||S.eDisplay.length<=1?'0':S.eDisplay.slice(0,-1)||'0'}); }
function engPM() { set({eDisplay:S.eDisplay.startsWith('-')?S.eDisplay.slice(1):S.eDisplay==='0'?'0':'-'+S.eDisplay}); }

// ── 환율 ─────────────────────────────────────────────────────────────────────
const CURRENCIES = [
  {code:'KRW',flag:'🇰🇷',name:'한국 원'},{code:'USD',flag:'🇺🇸',name:'미국 달러'},
  {code:'JPY',flag:'🇯🇵',name:'일본 엔'},{code:'EUR',flag:'🇪🇺',name:'유로'},
  {code:'GBP',flag:'🇬🇧',name:'영국 파운드'},{code:'CNY',flag:'🇨🇳',name:'중국 위안'},
  {code:'HKD',flag:'🇭🇰',name:'홍콩 달러'},{code:'SGD',flag:'🇸🇬',name:'싱가포르 달러'},
  {code:'AUD',flag:'🇦🇺',name:'호주 달러'},{code:'CAD',flag:'🇨🇦',name:'캐나다 달러'},
];
const MOCK = {KRW:1,USD:0.000735,JPY:0.1098,EUR:0.000678,GBP:0.000580,CNY:0.005321,HKD:0.005736,SGD:0.000992,AUD:0.001138,CAD:0.001018};

async function fetchRates() {
  set({fxLoading:true});
  try {
    const res=await fetch('https://api.frankfurter.app/latest?from=KRW&to=USD,JPY,EUR,GBP,CNY,HKD,SGD,AUD,CAD');
    if (!res.ok) throw 0;
    const data=await res.json();
    const rates={KRW:1,...data.rates};
    localStorage.setItem('fx_rates',JSON.stringify(rates));
    localStorage.setItem('fx_updated',new Date().toISOString());
    set({fxRates:rates,fxUpdated:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),fxLoading:false});
  } catch {
    const c=localStorage.getItem('fx_rates'), t=localStorage.getItem('fx_updated');
    if (c) set({fxRates:JSON.parse(c),fxUpdated:`캐시 ${t?new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}`,fxLoading:false});
    else set({fxRates:MOCK,fxUpdated:'샘플 데이터',fxLoading:false});
  }
}
function fxConv(amount,from,to) {
  if (!S.fxRates[from]||!S.fxRates[to]) return null;
  const r=(parseFloat(amount)/S.fxRates[from])*S.fxRates[to];
  if (!isFinite(r)) return null;
  return r.toLocaleString('ko-KR',to==='KRW'||to==='JPY'?{maximumFractionDigits:0}:{minimumFractionDigits:2,maximumFractionDigits:4});
}

    {name:'미터',sym:'m',to:v=>v,from:v=>v},

    {name:'피트',sym:'ft',to:v=>v*0.3048,from:v=>v/0.3048},

  ],
  '무게':[

    {name:'밀리그램',sym:'mg',to:v=>v/1000,from:v=>v*1000},

  ],
  '온도':[

    {name:'화씨',sym:'°F',to:v=>(v-32)*5/9,from:v=>v*9/5+32},
    {name:'켈빈',sym:'K',to:v=>v-273.15,from:v=>v+273.15},
  ],
  '부피':[
    {name:'리터',sym:'L',to:v=>v*1000,from:v=>v/1000},
    {name:'밀리리터',sym:'mL',to:v=>v,from:v=>v},
    {name:'갤런(미)',sym:'gal',to:v=>v*3785.41,from:v=>v/3785.41},
    {name:'쿼트',sym:'qt',to:v=>v*946.353,from:v=>v/946.353},
    {name:'파인트',sym:'pt',to:v=>v*473.176,from:v=>v/473.176},
    {name:'컵',sym:'cup',to:v=>v*236.588,from:v=>v/236.588},
    {name:'큰술',sym:'tbsp',to:v=>v*14.787,from:v=>v/14.787},
    {name:'작은술',sym:'tsp',to:v=>v*4.929,from:v=>v/4.929},
  ],
  '면적':[
    {name:'제곱미터',sym:'m²',to:v=>v,from:v=>v},
    {name:'제곱킬로미터',sym:'km²',to:v=>v*1e6,from:v=>v/1e6},
    {name:'헥타르',sym:'ha',to:v=>v*1e4,from:v=>v/1e4},
    {name:'평',sym:'평',to:v=>v*3.30579,from:v=>v/3.30579},
    {name:'에이커',sym:'ac',to:v=>v*4046.86,from:v=>v/4046.86},
    {name:'제곱피트',sym:'ft²',to:v=>v*0.0929,from:v=>v/0.0929},
  ],
  '속도':[
    {name:'km/h',sym:'km/h',to:v=>v,from:v=>v},
    {name:'m/s',sym:'m/s',to:v=>v*3.6,from:v=>v/3.6},
    {name:'mph',sym:'mph',to:v=>v*1.60934,from:v=>v/1.60934},
    {name:'노트',sym:'kn',to:v=>v*1.852,from:v=>v/1.852},
    {name:'마하',sym:'Mach',to:v=>v*1235.52,from:v=>v/1235.52},
  ],
  '데이터':[
    {name:'기가바이트',sym:'GB',to:v=>v*1e9,from:v=>v/1e9},
    {name:'메가바이트',sym:'MB',to:v=>v*1e6,from:v=>v/1e6},
    {name:'킬로바이트',sym:'KB',to:v=>v*1000,from:v=>v/1000},
    {name:'바이트',sym:'B',to:v=>v,from:v=>v},
    {name:'테라바이트',sym:'TB',to:v=>v*1e12,from:v=>v/1e12},
    {name:'비트',sym:'bit',to:v=>v/8,from:v=>v*8},
  ],
};
function uConv(val,from,to,cat) {
  const us=UNITS[cat], v=parseFloat(val);
  if (isNaN(v)||!us) return '—';
  if (from===to) return v.toLocaleString('ko-KR',{maximumFractionDigits:8});
  const r=us[to].from(us[from].to(v));
  if (!isFinite(r)) return '—';
  if (Math.abs(r)>=1e10||(Math.abs(r)<1e-6&&r!==0)) return r.toExponential(4);
  return r.toLocaleString('ko-KR',{maximumFractionDigits:6});
}

// ── HTML 생성 ─────────────────────────────────────────────────────────────────
function histHTML(side) {
  const h=S.history;
  const dd = S.histOpen ? `
    <div class="hist-dropdown">
      <div class="hist-dd-head">
        <span class="hist-dd-title">계산 기록</span>
        ${h.length?'<button class="hist-clear">전체 삭제</button>':''}
      </div>
      ${h.length
        ? h.map((item,i)=>`<div class="hist-item" data-hi="${i}" data-side="${side}">
            <span class="hist-lhs">${item.expr}</span>
            <span class="hist-rhs">${item.result}</span>
          </div>`).join('')
        : '<div class="hist-empty">계산 기록이 없습니다</div>'}
    </div>` : '';
  return `<div class="hist-row">
    <button class="hist-btn${S.histOpen?' open':''}" data-histbtn>
      🕐 최근 기록${h.length?` (${h.length})`:''}
      <span class="hist-chevron">▼</span>
    </button>
    <button class="bs-btn" data-bs="${side}">⌫</button>
    ${dd}
  </div>`;
}

function renderStd() {
  const dv=S.display==='Error'?'오류':fmt(S.display);
  const acL=S.display!=='0'||S.prevVal?'C':'AC';
  const op=(v,l)=>`<button class="btn btn-op${S.op===v&&S.waitNext?' lit':''}" data-op="${v}">${l}</button>`;
  const n=(d,c='btn btn-num')=>`<button class="${c}" data-num="${d}">${d}</button>`;
  return `
    <div class="display">
      <div class="disp-prev">${S.prevExpr}</div>
      <div class="disp-expr">${S.expr}</div>
      <div class="disp-main" style="font-size:${fontSize(dv)}">${dv}</div>
    </div>
    ${histHTML('std')}
    <div class="grid">
      <button class="btn btn-fn" data-sfn="ac">${acL}</button>
      <button class="btn btn-fn" data-sfn="pm">+/−</button>
      <button class="btn btn-fn" data-sfn="pct">%</button>
      ${op('÷','÷')}
      ${n('7')}${n('8')}${n('9')}${op('×','×')}
      ${n('4')}${n('5')}${n('6')}${op('−','−')}
      ${n('1')}${n('2')}${n('3')}${op('+','+')}
      ${n('0','btn btn-num btn-zero')}${n('.')}
      <button class="btn btn-eq" data-sfn="eq">=</button>
    </div>`;
}

function renderEng() {
  const dv=S.eDisplay==='Error'?'오류':fmt(S.eDisplay);
  const acL=S.eDisplay!=='0'||S.ePrevVal?'C':'AC';
  const S2=S.eSecond;
  const eop=(v)=>`<button class="ebtn ebtn-op${S.eOp===v&&S.eWait?' lit':''}" data-eop="${v}">${v}</button>`;
  const en=(d)=>`<button class="ebtn ebtn-num" data-en="${d}">${d}</button>`;
  const ef=(lbl,act,cls='ebtn ebtn-fn',sub='')=>
    `<button class="${cls}" data-ef="${act}">${sub?`<span>${lbl}</span><span class="ebtn-sub">${sub}</span>`:lbl}</button>`;
  return `
    <div class="display">
      <div class="disp-prev">${S.ePrevExpr}</div>
      <div class="disp-expr">${S.eExpr}</div>
      <div class="disp-main" style="font-size:${fontSize(dv)}">${dv}</div>
    </div>
    ${histHTML('eng')}
    <div class="eng-mode-row">
      <button class="mode-pill${S.eMode==='DEG'?' on':''}" data-emode="DEG">DEG</button>
      <button class="mode-pill${S.eMode==='RAD'?' on':''}" data-emode="RAD">RAD</button>
      <button class="mode-pill${S2?' on':''}" data-ef="2nd">2nd</button>
    </div>
    <div class="eng-grid">
      ${ef(S2?'2nd✓':'2nd','2nd',`ebtn ebtn-fn${S2?' ebtn-spec':''}`)}
      ${ef('xʸ','xy')}${ef(S2?'x²':'√',S2?'sq':'sqrt')}
      ${ef('n!','fact')}${ef(acL,'ac')}
      ${ef('sin','sin','ebtn ebtn-trig',S2?'sin⁻¹':'')}
      ${ef('cos','cos','ebtn ebtn-trig',S2?'cos⁻¹':'')}
      ${ef('tan','tan','ebtn ebtn-trig',S2?'tan⁻¹':'')}
      ${ef('ln','ln','ebtn ebtn-trig',S2?'eˣ':'')}
      ${ef('log','log','ebtn ebtn-trig',S2?'10ˣ':'')}
      ${ef('(','noop')}${ef(')','noop')}
      ${ef('1/x','inv')}${ef('|x|','abs')}${eop('÷')}
      ${en('7')}${en('8')}${en('9')}
      ${ef('π','pi','ebtn ebtn-spec')}${eop('×')}
      ${en('4')}${en('5')}${en('6')}
      ${ef('e','euler','ebtn ebtn-spec')}${eop('−')}
      ${en('1')}${en('2')}${en('3')}
      ${ef('⌫','bs')}${eop('+')}
      <button class="ebtn ebtn-num ebtn-zero" data-en="0">0</button>
      ${en('.')}${ef('+/-','pm')}
      <button class="ebtn ebtn-eq" data-ef="eq">=</button>
    </div>`;
}

function renderFx() {
  const base=CURRENCIES.find(c=>c.code===S.fxBase);
  const rows=CURRENCIES.filter(c=>c.code!==S.fxBase).map(c=>{
    const val=fxConv(S.fxAmount||'0',S.fxBase,c.code);
    const rate=fxConv('1',S.fxBase,c.code);
    return `<div class="fx-row" data-fxcode="${c.code}" data-fxval="${val?.replace(/,/g,'')||'0'}">
      <div class="fx-row-left"><span class="fx-row-flag">${c.flag}</span>
        <div><div class="fx-row-code">${c.code}</div><div class="fx-row-name">${c.name}</div></div>
      </div>
      <div style="text-align:right">
        <div class="fx-row-val">${val??'—'}</div>
        <div class="fx-row-rate">1 ${S.fxBase} = ${rate} ${c.code}</div>
      </div></div>`;
  }).join('');
  return `<div class="fx-wrap">
    <div class="fx-status">
      <span class="fx-status-text">${S.fxUpdated?`업데이트: ${S.fxUpdated}`:'로딩 중...'}</span>
      <button class="fx-refresh${S.fxLoading?' spinning':''}" data-sfn="fxrefresh">↻ 새로고침</button>
    </div>
    <div class="fx-base">
      <div class="fx-base-left"><span class="fx-flag">${base?.flag}</span>
        <div><div class="fx-code">${S.fxBase}</div><div class="fx-name">${base?.name}</div></div>
      </div>
      <input class="fx-input" id="fx-inp" type="number" value="${S.fxAmount}" placeholder="0"/>
    </div>
    ${S.fxLoading?'<div class="fx-loading">불러오는 중...</div>':
      Object.keys(S.fxRates).length?`<div class="fx-list">${rows}</div>`:''}
  </div>`;
}

function renderUnits() {
  const cats=Object.keys(UNITS);
  const catBtns=cats.map(c=>`<button class="unit-cat${S.uCat===c?' on':''}" data-ucat="${c}">${c}</button>`).join('');
  const units=UNITS[S.uCat], fu=units[S.uFrom];
  const rows=units.map((u,i)=>{
    if (i===S.uFrom) return '';
    const val=uConv(S.uAmount||'0',S.uFrom,i,S.uCat);
    return `<div class="unit-row" data-urow="${i}" data-uval="${val.replace(/,/g,'')}">
      <div><div class="unit-row-name">${u.name}</div><div class="unit-row-sym">${u.sym}</div></div>
      <div><div class="unit-row-val">${val}</div></div>
    </div>`;
  }).join('');
  return `<div class="unit-wrap">
    <div class="unit-cats">${catBtns}</div>
    <div class="unit-input-box">
      <div><div class="unit-input-label">${fu.name}</div><div class="unit-input-sub">${fu.sym}</div></div>
      <input class="unit-inp" id="unit-inp" type="number" value="${S.uAmount}" placeholder="0"/>
    </div>
    <div class="unit-list">${rows}</div>
  </div>`;
}

// ── 렌더 + 이벤트 바인딩 ─────────────────────────────────────────────────────
function render() {
  const app=document.getElementById('app');
  const TABS=[['standard','⌨️','일반'],['engineering','∑','공학'],['currency','₩','환율'],['units','⇔','단위']];
  const tabHTML=TABS.map(([id,icon,label])=>
    `<button class="tab${S.tab===id?' on':''}" data-tab="${id}"><span class="tab-icon">${icon}</span>${label}</button>`
  ).join('');
  let content='';
  if (S.tab==='standard')    content=renderStd();
  if (S.tab==='engineering') content=renderEng();
  if (S.tab==='currency')    content=renderFx();
  if (S.tab==='units')       content=renderUnits();

  app.innerHTML=`
    <div class="app-header"><span class="app-title">Calc<span>.</span></span></div>
    <div class="tabs">${tabHTML}</div>
    ${content}`;

  // ── 탭 ──
  app.querySelectorAll('[data-tab]').forEach(el=>on(el,()=>{
    S.histOpen=false; S.tab=el.dataset.tab;
    if (S.tab==='currency'&&!Object.keys(S.fxRates).length) fetchRates();
    render();
  }));

  // ── 히스토리 ──
  const hBtn=app.querySelector('[data-histbtn]');
  if (hBtn) on(hBtn,()=>set({histOpen:!S.histOpen}));
  const hClear=app.querySelector('.hist-clear');
  if (hClear) on(hClear,()=>{ S.history=[]; saveHist(); set({histOpen:false}); });
  app.querySelectorAll('[data-hi]').forEach(el=>on(el,()=>{
    const h=S.history[+el.dataset.hi];
    if (!h) return;
    if (el.dataset.side==='std') set({display:h.result.replace(/,/g,''),prevExpr:h.expr+' =',expr:'',op:null,prevVal:null,waitNext:true,histOpen:false});
    else set({eDisplay:h.result.replace(/,/g,''),ePrevExpr:h.expr+' =',eExpr:'',eOp:null,ePrevVal:null,eWait:true,histOpen:false});
  }));

  // ── 백스페이스 ──
  app.querySelectorAll('[data-bs]').forEach(el=>on(el,()=>el.dataset.bs==='std'?stdBS():engBS()));

  // ── 일반 계산기 ──
  app.querySelectorAll('[data-num]').forEach(el=>on(el,()=>stdNum(el.dataset.num)));
  app.querySelectorAll('[data-op]').forEach(el=>on(el,()=>stdOp(el.dataset.op)));
  app.querySelectorAll('[data-sfn]').forEach(el=>{
    const f=el.dataset.sfn;
    on(el,()=>{
      if (f==='ac') stdAC();
      else if (f==='pm') stdPM();
      else if (f==='pct') stdPct();
      else if (f==='eq') stdEq();
      else if (f==='fxrefresh') fetchRates();
    });
  });

  // ── 공학 계산기 ──
  app.querySelectorAll('[data-en]').forEach(el=>on(el,()=>engNum(el.dataset.en)));
  app.querySelectorAll('[data-eop]').forEach(el=>on(el,()=>engBinOp(el.dataset.eop)));
  app.querySelectorAll('[data-emode]').forEach(el=>on(el,()=>set({eMode:el.dataset.emode})));
  app.querySelectorAll('[data-ef]').forEach(el=>{
    const f=el.dataset.ef;
    on(el,()=>{
      if      (f==='ac')    engAC();
      else if (f==='bs')    engBS();
      else if (f==='pm')    engPM();
      else if (f==='eq')    engEq();
      else if (f==='2nd')   set({eSecond:!S.eSecond});
      else if (f==='xy')    engBinOp('^');
      else if (f==='sqrt'||f==='sq') engUnary('√');
      else if (f==='fact')  engUnary('n!');
      else if (f==='sin')   engUnary('sin');
      else if (f==='cos')   engUnary('cos');
      else if (f==='tan')   engUnary('tan');
      else if (f==='ln')    engUnary('ln');
      else if (f==='log')   engUnary('log');
      else if (f==='inv')   engUnary('1/x');
      else if (f==='abs')   engUnary('|x|');
      else if (f==='pi')    set({eDisplay:numStr(Math.PI),eWait:true});
      else if (f==='euler') set({eDisplay:numStr(Math.E),eWait:true});
    });
  });

  // ── 환율 input (포커스 유지) ──
  const fxInp=document.getElementById('fx-inp');
  if (fxInp) {
    fxInp.addEventListener('input',()=>{
      S.fxAmount=fxInp.value;
      const list=app.querySelector('.fx-list');
      if (!list) return;
      list.innerHTML=CURRENCIES.filter(c=>c.code!==S.fxBase).map(c=>{
        const val=fxConv(S.fxAmount||'0',S.fxBase,c.code);
        const rate=fxConv('1',S.fxBase,c.code);
        return `<div class="fx-row" data-fxcode="${c.code}" data-fxval="${val?.replace(/,/g,'')||'0'}">
          <div class="fx-row-left"><span class="fx-row-flag">${c.flag}</span>
            <div><div class="fx-row-code">${c.code}</div><div class="fx-row-name">${c.name}</div></div>
          </div>
          <div style="text-align:right">
            <div class="fx-row-val">${val??'—'}</div>
            <div class="fx-row-rate">1 ${S.fxBase} = ${rate} ${c.code}</div>
          </div></div>`;
      }).join('');
      app.querySelectorAll('[data-fxcode]').forEach(el=>on(el,()=>set({fxBase:el.dataset.fxcode,fxAmount:el.dataset.fxval})));
    });
  }
  app.querySelectorAll('[data-fxcode]').forEach(el=>on(el,()=>set({fxBase:el.dataset.fxcode,fxAmount:el.dataset.fxval})));

  // ── 단위 변환 input (포커스 유지) ──
  const uInp=document.getElementById('unit-inp');
  if (uInp) {
    uInp.addEventListener('input',()=>{
      S.uAmount=uInp.value;
      const list=app.querySelector('.unit-list');
      if (!list) return;
      const units=UNITS[S.uCat];
      list.innerHTML=units.map((u,i)=>{
        if (i===S.uFrom) return '';
        const val=uConv(S.uAmount||'0',S.uFrom,i,S.uCat);
        return `<div class="unit-row" data-urow="${i}" data-uval="${val.replace(/,/g,'')}">
          <div><div class="unit-row-name">${u.name}</div><div class="unit-row-sym">${u.sym}</div></div>
          <div><div class="unit-row-val">${val}</div></div>
        </div>`;
      }).join('');
      app.querySelectorAll('[data-urow]').forEach(el=>on(el,()=>set({uFrom:+el.dataset.urow,uAmount:el.dataset.uval})));
    });
  }
  app.querySelectorAll('[data-ucat]').forEach(el=>on(el,()=>set({uCat:el.dataset.ucat,uFrom:0,uAmount:'1'})));
  app.querySelectorAll('[data-urow]').forEach(el=>on(el,()=>set({uFrom:+el.dataset.urow,uAmount:el.dataset.uval})));
}

// ── 키보드 ────────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if (S.tab!=='standard'||document.activeElement?.tagName==='INPUT') return;
  if (e.key>='0'&&e.key<='9') stdNum(e.key);
  else if (e.key==='.') stdNum('.');
  else if (e.key==='+') stdOp('+');
  else if (e.key==='-') stdOp('−');
  else if (e.key==='*') stdOp('×');
  else if (e.key==='/') { e.preventDefault(); stdOp('÷'); }
  else if (e.key==='Enter'||e.key==='=') stdEq();
  else if (e.key==='Backspace') stdBS();
  else if (e.key==='Escape') stdAC();
  else if (e.key==='%') stdPct();
});

// ── 시작 ─────────────────────────────────────────────────────────────────────
render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
